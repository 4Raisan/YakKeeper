<rect x="458" y="392" width="364" height="130" rx="10" fill="#171425"/>
<text x="478" y="425" font-size="21" font-weight="600">/api/hub</text><text x="478" y="458" class="sub">Validate input &amp; request origin</text><text x="478" y="491" class="sub">Verify identity, role &amp; ownership</text>
<text x="460" y="562" class="sub">Projects · invitations · private inbox</text><text x="460" y="598" class="sub">Database-backed submission limit</text>
