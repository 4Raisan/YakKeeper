<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
<title id="title">YakKeeper public collaboration platform architecture</title>
<desc id="desc">GitHub OAuth through Supabase verifies account identity. Public repository metadata is read from GitHub without write scopes. Next.js checks ownership before using a server key to access Supabase Postgres. The loopback-only sandbox uses a separate local SQLite store and explicitly unverified demo sessions. WhatsApp is optional for administrator projects.</desc>
