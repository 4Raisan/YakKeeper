<text x="60" y="65" font-size="34" font-weight="700">YakKeeper</text><text x="60" y="100" class="sub">Where projects meet their next contributors.</text><text x="60" y="140" class="small">Public collaboration platform · recommended production deployment</text>
<rect x="60" y="280" width="320" height="425" rx="16" class="box"/><use href="#browser" x="320" y="300" width="30" height="30"/>
<text x="85" y="320" class="tag">BROWSER</text><text x="85" y="365" font-size="26" font-weight="600">Explore + workspace</text><text x="85" y="410" class="sub">Two-column cards · mobile stack</text><text x="85" y="446" class="sub">Pick a repository and publish</text><text x="85" y="482" class="sub">Apply and track responses</text><text x="85" y="518" class="sub">Manage your projects + profile</text><text x="85" y="590" class="small">Focus refresh + cross-tab notices</text><text x="85" y="620" class="small">Visible refresh every 60 seconds</text><text x="85" y="665" class="small">No GitHub passwords collected</text>
<rect x="490" y="280" width="420" height="425" rx="18" fill="#271e43" stroke="#8b6edb" stroke-width="2"/><use href="#vercel" x="850" y="302" width="27" height="27"/>
<text x="520" y="320" class="tag">NEXT.JS / VERCEL · NODE 22</text><text x="520" y="365" font-size="26" font-weight="600">API boundary · /api/hub</text><text x="520" y="413" class="sub">Verify identity and repository owner</text><text x="520" y="450" class="sub">Validate writes + enforce permissions</text><text x="520" y="487" class="sub">CDN assets + serverless API</text><text x="520" y="540" class="small">Public metadata: 5-minute instance cache</text><text x="520" y="575" class="small">Fresh ownership check before publishing</text><text x="520" y="610" class="small">Paginated project + repository reads</text><text x="520" y="665" class="small">No production filesystem persistence</text>
<rect x="1040" y="180" width="400" height="160" rx="16" class="box"/><use href="#supabase" x="1340" y="200" width="28" height="28"/><use href="#github" x="1388" y="200" width="28" height="28"/><text x="1065" y="216" class="tag">SUPABASE AUTH + GITHUB</text><text x="1065" y="258" font-size="25" font-weight="600">OAuth sign-in · PKCE</text><text x="1065" y="295" class="sub">Verified provider identity + app session</text><text x="1065" y="321" class="small">Account control, not real-world verification</text>
<rect x="1040" y="390" width="400" height="160" rx="16" class="box"/><use href="#github" x="1388" y="410" width="28" height="28"/><text x="1065" y="426" class="tag">GITHUB PUBLIC REST API</text><text x="1065" y="468" font-size="25" font-weight="600">Profiles + repositories</text><text x="1065" y="505" class="sub">Public, personally owned repositories</text><text x="1065" y="532" class="small">No code writes or repository access grants</text>
<rect x="1040" y="600" width="400" height="160" rx="16" class="box"/><use href="#supabase" x="1340" y="620" width="28" height="28"/><use href="#postgresql" x="1388" y="620" width="28" height="28"/><text x="1065" y="636" class="tag">SUPABASE POSTGRES + STORAGE</text><text x="1065" y="678" font-size="25" font-weight="600">Records + private banners</text><text x="1065" y="715" class="sub">Profiles · projects · requests · WebP covers</text><text x="1065" y="742" class="small">RLS · server checks · expiring image links</text>
<rect x="60" y="810" width="850" height="150" rx="16" class="box" stroke-dasharray="7 6"/><use href="#database" x="845" y="834" width="30" height="30"/><text x="85" y="848" class="tag">LOCAL SANDBOX ONLY · ALTERNATIVE DATA PATH</text><text x="85" y="891" font-size="25" font-weight="600">SQLite + HttpOnly demo sessions</text><text x="85" y="932" class="sub">Local testing only · unverified accounts · never deploy the SQLite data file</text>
<rect x="1040" y="810" width="400" height="150" rx="16" class="box" stroke-dasharray="7 6"/><use href="#chat" x="1388" y="830" width="28" height="28"/><text x="1065" y="846" class="tag">OPTIONAL · META WHATSAPP</text><text x="1065" y="889" font-size="25" font-weight="600">Administrator alerts</text><text x="1065" y="929" class="small">After saving requests to admin projects</text>
<path d="M220 280V235H1040" class="line"/><text x="520" y="221" class="small">Sign in through GitHub → Supabase callback</text>
<path d="M380 470H490" class="line"/><text x="398" y="452" class="small">HTTPS</text>
<path d="M910 405H980V300H1040" class="line"/><text x="923" y="390" class="small">Verify</text>
<path d="M910 480H1040" class="line"/><text x="925" y="463" class="small">Read only</text>
<path d="M910 650H1040" class="line"/><text x="925" y="632" class="small">Secret key</text>
<path d="M700 705V810" class="line dash"/><text x="720" y="780" class="small">Loopback host only</text>
<path d="M910 690H975V880H1040" class="line dash"/>
<text x="60" y="1010" font-size="17" fill="#c5b2ee">No repository write scopes. No private repository import. No invitation gate for public GitHub-connected publishers.</text>
<text x="60" y="1045" class="small">Implementation diagram. Real OAuth needs provider credentials and the server key. Sandbox sessions are never GitHub verified.</text>
