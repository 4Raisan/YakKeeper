<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">YakKeeper architecture</title>
<desc id="desc">Visitors and invited publishers use a Next.js board hosted on Vercel. The browser signs in through Supabase Auth. The server verifies tokens and checks permissions before using its secret key to access Postgres. Saved submissions can trigger optional Meta WhatsApp notifications. Deployment and external credentials still require configuration.</desc>
